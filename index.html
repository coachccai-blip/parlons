<!--
  Parlons ! — ce fichier contient toute l'application (phrases, styles, programme).
  Aucune dépendance, aucun serveur. La progression est enregistrée dans le navigateur de
  l'étudiant (localStorage), ses enregistrements dans IndexedDB. Rien n'est envoyé au professeur.

  À côté de ce fichier : manifest.webmanifest et icons/ (installation sur téléphone), sw.js
  (fonctionnement hors connexion, rappel quotidien). Les étudiants reçoivent automatiquement
  chaque nouvelle version de ce fichier, sans perdre leur progression.

  Pour modifier les phrases : chercher « CATS » plus bas (une phrase par ligne). Ajouter les
  nouvelles phrases à la FIN d'un thème : l'identifiant d'une phrase est sa position, en insérer
  au milieu décalerait la progression déjà enregistrée par les étudiants.
-->
<style id="app-style">
:root {
  --bg: #FAF6EE; --surface: #FFFFFF; --surface-2: #F3EDE1; --line: #E6DFD0;
  --ink: #1E2238; --muted: #5E637A; --faint: #9A9DB0;
  --primary: #2F4BD8; --primary-ink: #FFFFFF; --primary-soft: #E4E9FF;
  --ok: #1F9D62; --ok-soft: #DDF4E8; --warn: #C9741F; --warn-soft: #FBEBD8;
  --bad: #D6453D; --bad-soft: #FBE1DF; --gold: #E9A820; --rec: #E5484D;
  --shadow: 0 1px 2px rgba(30,34,56,.06), 0 8px 24px rgba(30,34,56,.07);
  --radius: 18px;
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13151F; --surface: #1C1F2E; --surface-2: #262A3B; --line: #30344A;
    --ink: #F1EEE6; --muted: #A9ADC2; --faint: #73778E;
    --primary: #8196FF; --primary-ink: #0E1330; --primary-soft: #242C57;
    --ok: #4CCB8F; --ok-soft: #173527; --warn: #F0A65A; --warn-soft: #3A2A17;
    --bad: #F27A72; --bad-soft: #3D1E1C; --gold: #F2C14E; --rec: #F0575C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); min-height: 100dvh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(96px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; }
.brand-name { font: 700 22px/1 var(--serif); letter-spacing: -.01em; }
.brand-name em { font-style: normal; color: var(--primary); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
.tab { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px;
  border: 0; background: none; border-radius: 12px; color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; }
.tab[aria-current="page"] { color: var(--primary); background: var(--primary-soft); }
@media (min-width: 720px) {
  .shell { padding-bottom: 48px; }
  .tabs { position: static; background: none; backdrop-filter: none; border: 0; padding: 0; }
  .tab { flex: none; flex-direction: row; gap: 8px; font-size: 14px; padding: 8px 14px; }
}
body.is-practice .tabs { display: none; }
body.is-practice .shell { padding-bottom: 32px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.muted { color: var(--muted); }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--primary)); transition: width .5s cubic-bezier(.2,.7,.2,1); }

/* Accueil */
.hello { font: 700 clamp(26px, 6vw, 34px)/1.15 var(--serif); letter-spacing: -.015em; }
.hello + p { margin-top: 4px; }
.hero { margin-top: 18px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: 128px; height: 128px; }
.ring svg { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; }
.ring .track { stroke: var(--surface-2); }
.ring .fill { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1); }
.ring.done .fill { stroke: var(--ok); }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label b { font: 700 34px/1 var(--serif); }
.ring-label span { font-size: 12px; color: var(--muted); }
.hero h2 { font-size: 18px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.chip.fire { background: var(--warn-soft); color: var(--warn); }
.week { display: flex; gap: 6px; margin-top: 14px; }
.week div { flex: 1; text-align: center; font-size: 11px; color: var(--faint); font-weight: 600; }
.week i { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); margin-bottom: 4px; }
.week .part i { background: color-mix(in srgb, var(--primary) 40%, var(--surface-2)); }
.week .full i { background: var(--ok); }
.week .today { color: var(--ink); }
@media (max-width: 480px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .hero-meta { justify-content: center; } }

.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 2px 12px; }
.section-title h2 { font: 700 20px/1.2 var(--serif); }
.cats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.cat { display: block; padding: 16px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
.cat:hover { transform: translateY(-2px); border-color: var(--c); }
.cat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cat-emoji { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
  background: color-mix(in srgb, var(--c) 16%, var(--surface)); flex: none; }
.cat h3 { font-size: 16px; line-height: 1.25; }
.cat p { font-size: 13px; color: var(--muted); min-height: 2.9em; }
.cat-foot { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-top: 8px; color: var(--muted); }
.cat-foot b { color: var(--ink); }
.overall { padding: 16px; margin-top: 12px; }
.overall-row { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
.promo { margin-top: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; }
.promo-ico { width: 44px; height: 44px; border-radius: 14px; background: var(--primary-soft); display: grid; place-items: center; font-size: 22px; flex: none; }
.promo b { display: block; line-height: 1.3; }
.promo p { font-size: 14px; color: var(--muted); margin: 3px 0 10px; }
.promo .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }

/* Pratique */
.p-top { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; text-decoration: none; color: inherit; }
.p-title { flex: 1; min-width: 0; }
.p-title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-title span { font-size: 13px; color: var(--muted); }
.day-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; }
.day-pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.p-bar { height: 8px; margin-bottom: 16px; }
.phrase { padding: 26px 22px 20px; text-align: center; }
.phrase-num { font-size: 13px; font-weight: 700; color: var(--c); letter-spacing: .04em; text-transform: uppercase; }
.phrase-text { font: 600 clamp(24px, 6.2vw, 34px)/1.25 var(--serif); letter-spacing: -.01em; margin: 12px 0 18px; text-wrap: balance; }
.phrase-text .w-ok { color: var(--ok); }
.phrase-text .w-bad { color: var(--bad); text-decoration: underline wavy; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.listen { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }

.rec { margin-top: 14px; padding: 22px 18px; text-align: center; }
.mic { width: 92px; height: 92px; border-radius: 50%; border: 0; background: var(--primary); color: var(--primary-ink);
  display: inline-grid; place-items: center; box-shadow: 0 10px 24px color-mix(in srgb, var(--primary) 35%, transparent); transition: transform .12s; }
.mic:active { transform: scale(.96); }
.mic.live { background: var(--rec); color: #fff; --lvl: 0;
  box-shadow: 0 0 0 calc(6px + var(--lvl) * 30px) color-mix(in srgb, var(--rec) 22%, transparent); transition: box-shadow .08s linear; }
.mic.live.blind { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 22px color-mix(in srgb, var(--rec) 10%, transparent); } }
.rec-hint { margin-top: 14px; font-weight: 600; }
.rec-sub { font-size: 14px; color: var(--muted); margin-top: 4px; min-height: 1.5em; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--surface-2); border-top-color: var(--primary); animation: spin .8s linear infinite; margin: 28px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict { display: inline-flex; align-items: center; gap: 10px; font: 700 22px/1.2 var(--serif); }
.verdict .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: #fff; background: var(--ok); }
.verdict.mid .dot { background: var(--warn); } .verdict.low .dot { background: var(--bad); } .verdict.self .dot { background: var(--primary); color: var(--primary-ink); }
.stars { font-size: 26px; letter-spacing: 4px; margin-top: 8px; color: var(--gold); }
.stars s { text-decoration: none; color: var(--surface-2); }
.heard { margin: 12px auto 0; max-width: 34em; font-size: 15px; color: var(--muted); }
.heard q { color: var(--ink); font-style: italic; quotes: none; }
.compare { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
.actions .btn { min-width: 150px; }
.p-nav { display: flex; justify-content: space-between; margin-top: 14px; }
.list { margin-top: 14px; padding: 6px; }
.list a { display: flex; gap: 10px; align-items: baseline; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: inherit; font-size: 15px; }
.list a:hover, .list a[aria-current] { background: var(--surface-2); }
.list .n { width: 2em; text-align: right; color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.list .s { margin-left: auto; color: var(--gold); font-size: 13px; white-space: nowrap; flex: none; }
.finish { padding: 34px 22px; text-align: center; }
.finish .big { font-size: 56px; }
.finish h2 { font: 700 26px/1.2 var(--serif); margin: 8px 0; }

/* Succès */
.badges { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.badge { padding: 16px 12px; text-align: center; }
.badge .ico { width: 62px; height: 62px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 30px;
  background: color-mix(in srgb, var(--gold) 22%, var(--surface)); border: 2px solid var(--gold); }
.badge b { display: block; font-size: 15px; line-height: 1.25; }
.badge span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.badge small { display: block; margin-top: 6px; font-size: 11.5px; font-weight: 700; color: var(--ok); }
.badge.locked .ico { filter: grayscale(1); opacity: .45; background: var(--surface-2); border-color: var(--line); }
.badge.locked b { color: var(--muted); }

/* Réglages */
.form { padding: 4px 18px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row label, .row .lbl { font-weight: 600; }
.row small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; max-width: 34em; }
.row input[type="text"], .row select { min-height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; max-width: 220px; width: 100%; }
.row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); flex: none; }
.row.col { flex-direction: column; align-items: stretch; }
.row .btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* Fenêtres et messages */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,17,30,.55); display: grid; place-items: center; padding: 16px; }
.modal { width: min(460px, 100%); padding: 26px 22px; max-height: 92dvh; overflow: auto; }
.modal h2 { font: 700 26px/1.2 var(--serif); margin-bottom: 8px; }
.modal ol { padding-left: 20px; margin: 14px 0; color: var(--muted); }
.modal li { margin: 6px 0; } .modal li b { color: var(--ink); }
.modal input[type="text"] { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 14px; margin: 6px 0 16px; }
.modal h3 { font: 700 18px/1.2 var(--serif); margin: 18px 0 8px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); }
.dots i.on { width: 22px; border-radius: 99px; background: var(--primary); }
.w-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.w-nav .btn.primary { flex: 1; max-width: 240px; margin-left: auto; }
.voices { max-height: 42dvh; overflow: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.v-group { padding: 8px 10px 4px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.voice { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 10px; border-radius: 10px; cursor: pointer; }
.voice:hover { background: var(--surface-2); }
.voice:has(input:checked) { background: var(--primary-soft); }
.voice input { width: 20px; height: 20px; accent-color: var(--primary); flex: none; margin: 0; }
.v-name { flex: 1; min-width: 0; font-weight: 600; }
.v-name small { font-weight: 400; color: var(--muted); }
.hd { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; background: var(--gold); color: #1E2238; flex: none; }
.v-play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); flex: none; font-size: 13px; }
.gestures { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }

.gestures li > span { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 18px; color: var(--ink); }

kbd { font: 600 12px var(--sans); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }

const STORE_KEY = 'parlons.v1';
const PASS = 0.8;            // score minimal pour valider automatiquement
const MAX_TAKE_MS = 15000;   // durée maximale d'un enregistrement
const freshState = () => ({
  v: 1, name: '', onboarded: false, lastCat: null,
  settings: { goal: 20, voice: '', autoCheck: true, sounds: true, reminder: false, reminderTime: '18:00' },
  phrases: {}, days: {}, badges: {}, counters: {}, hints: {},
});
let storageOk = true;
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    return mergeState(JSON.parse(raw));
  } catch { storageOk = false; return freshState(); }
}
function mergeState(data) {
  const base = freshState();
  if (!data || typeof data !== 'object' || data.v !== 1) return base;
  return { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk = true; }
  catch { storageOk = false; }
  if (state.settings.reminder) mirrorReminder();
}

const dkey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayCount = () => (state.days[dkey()]?.ids.length) || 0;
function streak() {
  const d = new Date();
  if (!state.days[dkey(d)]?.reached) d.setDate(d.getDate() - 1); // la série reste en vie jusqu'à ce soir
  let n = 0;
  while (state.days[dkey(d)]?.reached) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function catProgress(cat) {
  let done = 0, stars = 0;
  for (const p of cat.phrases) { const s = state.phrases[p.id]; if (s?.ok) { done++; stars += s.stars || 0; } }
  return { done, total: cat.phrases.length, stars };
}
function computeStats() {
  const done = ALL.filter(p => state.phrases[p.id]?.ok);
  const day = state.days[dkey()];
  const catDone = {};
  CATS.forEach(c => { catDone[c.id] = catProgress(c).done === c.phrases.length; });
  return {
    total: done.length, catDone,
    stars3: done.filter(p => state.phrases[p.id].stars === 3).length,
    firstTry: done.filter(p => state.phrases[p.id].okFirst).length,
    goalDays: Object.values(state.days).filter(d => d.reached).length,
    streak: streak(), today: day?.ids.length || 0, todayCats: day?.cats.length || 0,
    grit: state.counters.grit || 0, early: !!state.counters.early, late: !!state.counters.late,
  };
}
function checkBadges() {
  const s = computeStats(), fresh = [];
  for (const b of BADGES) {
    if (!state.badges[b.id] && b.test(s)) { state.badges[b.id] = Date.now(); fresh.push(b); }
  }
  return fresh;
}
/** Enregistre une phrase réussie. mode : 'auto' (reconnaissance), 'self' (auto-évaluation), 'override'. */
function validate(p, mode, score) {
  const now = new Date(), cat = catById(p.cat);
  const ph = state.phrases[p.id] || (state.phrases[p.id] = { tries: 0 });
  const first = !ph.ok;
  const stars = mode === 'auto' ? (score >= 0.95 ? 3 : score >= 0.88 ? 2 : 1) : mode === 'self' ? 2 : 1;
  if (first) {
    ph.ok = true; ph.okFirst = ph.tries <= 1;
    if (ph.tries >= 4) state.counters.grit = (state.counters.grit || 0) + 1;
  }
  ph.stars = Math.max(ph.stars || 0, stars);
  ph.best = Math.max(ph.best || 0, score || 0);
  ph.at = now.getTime();
  const day = state.days[dkey(now)] || (state.days[dkey(now)] = { ids: [], cats: [], reached: false });
  if (!day.ids.includes(p.id)) day.ids.push(p.id);
  if (!day.cats.includes(cat.id)) day.cats.push(cat.id);
  let goalNow = false;
  if (!day.reached && day.ids.length >= state.settings.goal) { day.reached = true; goalNow = true; }
  if (now.getHours() < 8) state.counters.early = 1;
  if (now.getHours() >= 22) state.counters.late = 1;
  state.lastCat = cat.id;
  const newBadges = checkBadges();
  save();
  return { first, stars, goalNow, newBadges, catDone: first && catProgress(cat).done === cat.phrases.length };
}

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (parts[0] === 'theme' && catById(parts[1])) {
    const cat = catById(parts[1]);
    const n = parseInt(parts[2], 10);
    return { name: 'practice', cat, idx: n >= 1 && n <= cat.phrases.length ? n - 1 : null, end: parts[2] === 'fin' };
  }
  if (parts[0] === 'succes') return { name: 'badges' };
  if (parts[0] === 'reglages') return { name: 'settings' };
  return { name: 'home' };
}
let view = { cat: null, idx: 0, list: false, end: false };
const currentPhrase = () => (route().name === 'practice' && view.cat && !view.end ? view.cat.phrases[view.idx] : null);

  return '<header class="top"><a class="brand" href="#/" aria-label="Parlons, accueil"><span class="brand-mark">' + ICON.bubble +

function render() {
  const r = route();
  document.body.classList.toggle('is-practice', r.name === 'practice');
  if (r.name !== 'practice') { cancelTake(); Mic.close(); TTS.stop(); player.pause(); dropResult(); }
  if (r.name === 'practice') return enterPractice(r);
  app.innerHTML = '<div class="shell">' + header() + (r.name === 'badges' ? badgesHTML() : r.name === 'settings' ? settingsHTML() : homeHTML()) + '</div>' +
    (tourOpen() ? welcomeHTML() : sheet === 'install' ? installSheetHTML() : '');

}

/* ───────────────────────── Écran de pratique ───────────────────────── */
function enterPractice(r) {
  const changed = view.cat !== r.cat;
  const firstUndone = r.cat.phrases.findIndex(p => !state.phrases[p.id]?.ok);
  const idx = r.idx != null ? r.idx : firstUndone >= 0 ? firstUndone : 0;
  if (changed || idx !== view.idx || r.end !== view.end) { cancelTake(); dropResult(); recErrorMsg = ''; TTS.stop(); player.pause(); }
  view = { cat: r.cat, idx, end: r.end, list: changed ? false : view.list };
  if (savedUrl) { URL.revokeObjectURL(savedUrl); savedUrl = null; }
  renderPractice();
  if (!r.end) {
    const id = r.cat.phrases[idx].id;
    Takes.get(id).then(blob => {
      if (blob && currentPhrase()?.id === id && !savedUrl) { savedUrl = URL.createObjectURL(blob); renderPractice(); }
    });
  }
  window.scrollTo(0, 0);
}

    '</b><span>' + pr.done + ' / ' + pr.total + ' phrases validées</span></div><span class="day-pill' + (n >= goal ? ' done' : '') + '" title="Objectif du jour">🎯 ' + n + ' / ' + goal +
    '</span><button class="icon-btn" data-act="toggle-list" aria-label="Liste des phrases" aria-expanded="' + view.list + '">' + ICON.list + '</button></div>' +
    '<div class="bar p-bar" role="progressbar" aria-label="Progression du thème" aria-valuemin="0" aria-valuemax="' + pr.total + '" aria-valuenow="' + pr.done + '"><i style="width:' + (100 * pr.done / pr.total) + '%"></i></div>';
  let body;
  if (view.end) {
    const other = CATS.find(x => catProgress(x).done < x.phrases.length);
    body = '<div class="card finish"><div class="big">🎉</div><h2>Thème terminé !</h2><p class="muted">' + pr.total + ' phrases validées, ' + pr.stars + ' étoiles sur ' + pr.total * 3 + '.</p>' +
      '<div class="actions">' + (other ? '<a class="btn primary" href="#/theme/' + other.id + '">Thème suivant : ' + esc(other.name) + ' →</a>' : '<a class="btn primary" href="#/succes">Voir mes succès</a>') +
      '<a class="btn" href="#/theme/' + c.id + '/1">Réviser ce thème</a></div></div>';
  } else {
    const p = c.phrases[view.idx], ph = state.phrases[p.id];
    body = '<div class="card phrase"><div class="phrase-num">Phrase ' + (view.idx + 1) + ' sur ' + c.phrases.length + (ph?.ok ? ' · ' + '★'.repeat(ph.stars || 1) : '') + '</div>' +
      '<p class="phrase-text" lang="fr">' + phraseHTML(p) + '</p><div class="listen"><button class="btn" data-act="listen">🔊 Écouter</button>' +
      '<button class="btn" data-act="listen-slow">🐢 Lentement</button>' + (savedUrl && !result ? '<button class="btn ghost" data-act="play-saved">▶ Mon dernier enregistrement</button>' : '') + '</div>' +
      (TTS.ok ? '' : '<p class="note">Ce navigateur ne peut pas lire le modèle à voix haute.</p>') + '</div>' +
      '<div class="card rec" id="recorder" aria-live="polite">' + recorderHTML() + '</div>' +
      '<div class="p-nav"><a class="btn ghost small" href="#/theme/' + c.id + '/' + (view.idx > 0 ? view.idx : c.phrases.length) + '">← Précédente</a>' +
      '<a class="btn ghost small" href="' + nextHref() + '">' + (ph?.ok ? 'Suivante' : 'Passer') + ' →</a></div>';
  }
  const list = view.list ? '<nav class="card list" aria-label="Toutes les phrases du thème">' + c.phrases.map((p, i) => {
    const ph = state.phrases[p.id];
    return '<a href="#/theme/' + c.id + '/' + (i + 1) + '"' + (!view.end && i === view.idx ? ' aria-current="true"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + esc(pretty(p.text)) +
      '</span><span class="s">' + (ph?.ok ? '★'.repeat(ph.stars || 1) : '') + '</span></a>';
  }).join('') + '</nav>' : '';
  app.innerHTML = '<div class="shell" style="--c:' + c.color + '">' + top + body + list + '</div>';
}
function nextHref() {
  const c = view.cat, n = c.phrases.length;
  if (view.justDone) return '#/theme/' + c.id + '/fin';
  for (let k = 1; k <= n; k++) { const i = (view.idx + k) % n; if (!state.phrases[c.phrases[i].id]?.ok) return '#/theme/' + c.id + '/' + (i + 1); }
  // Tout est validé : on révise dans l'ordre, puis l'écran de fin après la dernière phrase.
  return view.idx + 1 < n ? '#/theme/' + c.id + '/' + (view.idx + 2) : '#/theme/' + c.id + '/fin';
}
function phraseHTML(p) {
  if (!(result && result.id === p.id && result.mode === 'auto' && result.ok)) return esc(pretty(p.text));
  let k = 0;
  return tokens(p.text).map(tok => {
    const part = result.ok.slice(k, k + tok.n); k += tok.n;
    const good = part.length && part.filter(Boolean).length >= part.length / 2;
    return '<span class="' + (good ? 'w-ok' : 'w-bad') + '">' + esc(tok.text) + '</span>';
  }).join(' ');
}
function recorderHTML() {
  if (take?.phase === 'starting') return '<div class="spinner"></div><p class="rec-hint">Ouverture du micro…</p>';
  if (take?.phase === 'recording') {
    return '<button class="mic live' + (take.useRec ? '' : ' blind') + '" id="mic" data-act="stop" aria-label="Terminer l\'enregistrement">' + ICON.stop + '</button>' +
      '<p class="rec-hint">Parlez, puis appuyez pour terminer</p><p class="rec-sub" id="rec-sub">Je vous écoute…</p>';
  }
  if (take?.phase === 'processing') return '<div class="spinner"></div><p class="rec-hint">Un instant…</p>';
  if (result) return resultHTML();
  return '<button class="mic" id="mic" data-act="record" aria-label="Commencer l\'enregistrement">' + ICON.mic + '</button>' +
    '<p class="rec-hint">' + (recErrorMsg ? esc(recErrorMsg) : 'Appuyez sur le micro et dites la phrase') + '</p>' +
    '<p class="rec-sub">' + (recErrorMsg ? '' : autoCheckOn() ? 'Le navigateur vérifie ce qu\'il comprend.' : 'Vous vous réécoutez, puis vous décidez.') + '</p>';
}
function resultHTML() {
  const r = result, p = currentPhrase();
  const compareBtns = '<div class="compare">' + (r.url ? '<button class="btn small" data-act="play-take">▶ Ma voix</button>' : '') + '<button class="btn small" data-act="listen">🔊 Le modèle</button></div>';
  const retry = '<button class="btn" data-act="record">↻ ' + (r.validated ? 'Refaire' : 'Réessayer') + '</button>';
  const next = '<a class="btn primary" href="' + nextHref() + '" data-next>Phrase suivante →</a>';
  if (r.nothing) {
    return '<div class="verdict low"><span class="dot">?</span>Je n\'ai rien entendu</div><p class="heard">Vérifiez votre micro et parlez un peu plus fort, près de l\'appareil.</p>' +
      '<div class="actions"><button class="btn primary" data-act="record">↻ Réessayer</button></div>';
  }
  if (r.mode === 'self' && !r.validated) {
    return '<div class="verdict self"><span class="dot">👂</span>À vous de juger</div><p class="heard">Écoutez votre enregistrement, puis le modèle. Est-ce que c\'est bien ?</p>' + compareBtns +
      '<div class="actions">' + retry + '<button class="btn ok" data-act="self-ok">✓ C\'est bon</button></div>';
  }
  if (r.validated) {
    const title = r.mode !== 'auto' ? 'Validé !' : r.score >= 0.95 ? 'Excellent !' : r.score >= 0.88 ? 'Très bien !' : 'Bien !';
    return '<div class="verdict"><span class="dot">✓</span>' + title + '</div><div class="stars">' + starsHTML(r.stars || 1) + '</div>' +
      (r.heard && r.score < 0.95 ? '<p class="heard">Le navigateur a compris : <q>« ' + esc(r.heard) + ' »</q></p>' : '') + compareBtns + '<div class="actions">' + retry + next + '</div>';
  }
  const near = r.score >= 0.55;
  return '<div class="verdict ' + (near ? 'mid' : 'low') + '"><span class="dot">' + (near ? '≈' : '↻') + '</span>' + (near ? 'Presque !' : 'Essayez encore') + '</div>' +
    '<p class="heard">Le navigateur a compris : <q>« ' + esc(r.heard) + ' »</q><br>Les mots soulignés sont à retravailler.</p>' + compareBtns +
    '<div class="actions"><button class="btn primary" data-act="record">↻ Réessayer</button></div>' +
    (r.tries >= 3 && !state.phrases[p.id]?.ok ? '<p class="note">La reconnaissance se trompe parfois. Si vous êtes sûr de l\'avoir bien dit : ' +
      '<button class="btn ghost small" data-act="override">valider quand même</button></p>' : '');
}
function renderRecorder() {
  const el = document.getElementById('recorder');
  if (el) el.innerHTML = recorderHTML();
}

/* ───────────────────────── Actions ───────────────────────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, p = currentPhrase();
  if (act === 'record') { recErrorMsg = ''; startTake(); }
  else if (act === 'stop') stopTake();
  else if (act === 'listen' && p) { player.pause(); TTS.speak(p.text, 0.95); }
  else if (act === 'listen-slow' && p) { player.pause(); TTS.speak(p.text, 0.65); }
  else if (act === 'play-take' && result?.url) playUrl(result.url, el);
  else if (act === 'play-saved' && savedUrl) playUrl(savedUrl, el);
  else if ((act === 'self-ok' || act === 'override') && p && result) {
    applyValidation(p, act === 'self-ok' ? 'self' : 'override', result.score || 0);
    location.hash = nextHref();
  }
  else if (act === 'toggle-list') { view.list = !view.list; renderPractice(); if (view.list) document.querySelector('.list')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'test-voice') TTS.speak(VOICE_SAMPLE);
  else if (act === 'tour') { tour = { open: true, step: 0 }; render(); }
  else if (act === 'w-back') { tour.step = Math.max(0, tour.step - 1); TTS.stop(); render(); }
  else if (act === 'voice-sample') { // ▶ dans le choix des voix : on choisit cette voix et on l'écoute
    const v = TTS.voices.find(x => x.voiceURI === el.dataset.uri);
    if (!v) return;
    const radio = el.closest('.voice').querySelector('input');
    radio.checked = true;
    state.settings.voice = v.voiceURI; save();
    TTS.speak(VOICE_SAMPLE, 0.95, v);
  }
  else if (act === 'install') installApp();
  else if (act === 'sheet-close') { sheet = null; render(); }
  else if (act === 'hint-off') { state.hints[el.dataset.hint] = 1; save(); render(); }
  else if (act === 'reminder-on') setReminder(true);
  else if (act === 'export') exportData();
  else if (act === 'import') document.getElementById('import-file').click();
  else if (act === 'reset') {
    if (confirm('Effacer toute votre progression, vos succès et vos enregistrements sur cet appareil ?')) {
      state = freshState(); state.onboarded = true; save(); syncReminder(); Takes.clear(); render(); toast('🧹', 'Données effacées');
    }
  }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'welcome') return;
  e.preventDefault();
  const name = new FormData(e.target).get('name');
  if (name !== null) state.name = name.toString().trim();
  TTS.stop();
  if (tour.step < 2) tour.step++;
  else { state.onboarded = true; tour = { open: false, step: 0 }; }
  save(); render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file') { importData(el.files[0]); el.value = ''; return; }
  if (el.name === 'w-voice') { // choix de la voix dans la présentation : on l'enregistre et on la fait entendre
    state.settings.voice = el.value; save();
    TTS.speak(VOICE_SAMPLE, 0.95, TTS.voices.find(v => v.voiceURI === el.value));
    return;
  }
  const key = el.dataset.set;
  if (!key) return;
  if (key === 'name') state.name = el.value.trim();
  else if (key === 'goal') {
    state.settings.goal = +el.value;
    const day = state.days[dkey()];
    if (day) day.reached = day.ids.length >= state.settings.goal; // l'objectif d'aujourd'hui suit le nouveau réglage
    checkBadges();
  }
  else if (key === 'voice') { state.settings.voice = el.value; save(); render(); return; }
  else if (key === 'autoCheck') { state.settings.autoCheck = el.checked; session.srOff = false; session.srErrors = 0; }
  else if (key === 'sounds') state.settings.sounds = el.checked;
  else if (key === 'reminder') { setReminder(el.checked); return; }
  else if (key === 'reminderTime') { state.settings.reminderTime = el.value; save(); syncReminder(); return; }
  save();
});
document.addEventListener('keydown', e => {
  if (route().name !== 'practice' || view.end || e.target.closest('input, select, textarea, button, a') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (take?.phase === 'recording') stopTake(); else if (!take) { recErrorMsg = ''; startTake(); } }
  else if (e.key === 'e' || e.key === 'E') { const p = currentPhrase(); if (p) TTS.speak(p.text, 0.95); }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { if (!take) location.hash = nextHref(); }
});
window.addEventListener('hashchange', () => { sheet = null; render(); applyUpdate(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (take?.phase === 'recording') stopTake(); return; }
  clearReminders(); applyUpdate();
  if (Date.now() - lastCheck > 10 * 60000) checkUpdate();
});
window.addEventListener('pagehide', () => { cancelTake(); Mic.close(); });

function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'parlons', exportedAt: new Date().toISOString(), state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'parlons-progression-' + dkey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'parlons' || data.state?.v !== 1) throw new Error('format');
    if (!confirm('Remplacer la progression de cet appareil par celle du fichier ?')) return;
    state = mergeState(data.state); state.onboarded = true; save(); syncReminder(); render();
    toast('✅', 'Progression importée');
  } catch { toast('⚠️', 'Fichier non reconnu', 'Choisissez un fichier exporté depuis Parlons !'); }
}

/* ───────────────────────── Installation, mises à jour, rappel quotidien ─────────────────────────
   Parlons ! s'installe sur l'écran d'accueil (manifest.webmanifest), fonctionne hors connexion
   (sw.js) et se met à jour tout seul. La progression vit dans localStorage, sous la clé
   STORE_KEY : une mise à jour n'y touche jamais. */
const online = /^https?:$/.test(location.protocol);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const swReady = online && 'serviceWorker' in navigator
  ? navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).catch(() => null) : Promise.resolve(null);
const rerender = () => { if (route().name !== 'practice') render(); };

/* Installation. Android et ordinateur : le navigateur fournit une invite, gardée pour le bouton
   « Installer ». iPhone : pas d'invite, on montre le chemin par le bouton Partager de Safari. */
let installEvt = null;
let sheet = null; // fenêtre ouverte par-dessus la page : 'install'
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (!tourOpen() && !document.activeElement?.matches('input[type="text"]')) rerender();
});
window.addEventListener('appinstalled', () => {
  installEvt = null; sheet = null;
  toast('📲', 'Application installée', 'Retrouvez Parlons ! avec vos autres applications.', 6000);
  rerender();
});
async function installApp() {
  if (!installEvt) { sheet = 'install'; render(); return; }
  const evt = installEvt; installEvt = null;
  try { evt.prompt(); await evt.userChoice; } catch {}
  rerender();
}
function promoHTML() {
  if (!state.onboarded) return '';
  const card = (icon, title, text, act, label, hint) => '<section class="card promo"><span class="promo-ico" aria-hidden="true">' + icon + '</span><div><b>' + title + '</b><p>' + text +
    '</p><div class="btns"><button class="btn small primary" data-act="' + act + '">' + label + '</button><button class="btn small ghost" data-act="hint-off" data-hint="' + hint + '">Plus tard</button></div></div></section>';
  if (!isStandalone() && !state.hints.install && (installEvt || isIOS)) {
    return card('📲', 'Installer Parlons ! sur ' + (isMobile ? 'ce téléphone' : 'cet appareil'),
      'Une icône sur l\'écran d\'accueil, comme une vraie application, et vos phrases même sans connexion.', 'install', 'Installer', 'install');
  }
  if (notifOk && Notification.permission === 'default' && !state.settings.reminder && !state.hints.notif && (isMobile || isStandalone())) {
    return card('🔔', 'Un rappel pour ne pas oublier ?', 'Recevez une notification à ' + timeLabel(state.settings.reminderTime) +
      ' les jours où votre objectif n\'est pas encore atteint.', 'reminder-on', 'Activer le rappel', 'notif');
  }
  return '';
}

/* Mises à jour. À chaque lancement, sw.js sert la dernière version publiée de cette page. Pour une
   application restée ouverte, on compare de temps en temps la version publiée à celle qui tourne
   (styles et programme) : si elle a changé, on recharge dès que cela ne dérange pas. */
const signature = doc => { const a = doc.getElementById('app-style'), b = doc.getElementById('app-code'); return a && b ? a.textContent + '\n' + b.textContent : ''; };
const RUNNING = signature(document);
let updateReady = '', lastCheck = 0;
function hashOf(text) { let h = 5381; for (let i = 0; i < text.length; i++) h = (h * 33 ^ text.charCodeAt(i)) >>> 0; return h.toString(36); }
async function checkUpdate() {
  if (!online || updateReady) return;
  lastCheck = Date.now();
  try {
    const res = await fetch(location.pathname, { cache: 'no-cache' });
    if (!res.ok) return;
    const sig = signature(new DOMParser().parseFromString(await res.text(), 'text/html'));
    if (!sig || sig === RUNNING) return;
    const h = hashOf(sig);
    if (sessionStorage.getItem('parlons.maj') === h) return; // déjà rechargé pour cette version : on n'insiste pas
    updateReady = h;
    applyUpdate();
  } catch {}
}
function applyUpdate() {
  if (!updateReady || take || tourOpen() || sheet || (route().name === 'practice' && result)) return;
  if (document.activeElement?.matches('input[type="text"]')) return;
  try { sessionStorage.setItem('parlons.maj', updateReady); sessionStorage.setItem('parlons.maj.vue', '1'); } catch { return; }
  location.reload();
}

/* Rappel quotidien. Sans serveur, une page web ne peut pas programmer une notification à heure
   fixe. Le rappel part donc de deux endroits : de cette page tant qu'elle est ouverte (minuterie),
   et de sw.js quand le navigateur le réveille (synchronisation périodique : application installée
   sur Android). sw.js décide et affiche ; il lit pour cela l'état du jour, copié ici dans un cache. */
const notifOk = online && 'Notification' in window && 'serviceWorker' in navigator && 'caches' in window;
const reminderOn = () => notifOk && !!state.settings.reminder && Notification.permission === 'granted';
const timeLabel = t => +t.slice(0, 2) + ' h' + (t.slice(3) === '00' ? '' : ' ' + t.slice(3));
const DATA_CACHE = 'parlons-donnees';
const dataUrl = name => new URL(name, location.href).href;
async function mirrorReminder() {
  if (!notifOk) return;
  try {
    const body = { on: reminderOn(), time: state.settings.reminderTime, goal: state.settings.goal, day: dkey(), count: todayCount(), streak: streak() };
    await (await caches.open(DATA_CACHE)).put(dataUrl('rappel-etat'), new Response(JSON.stringify(body)));
  } catch {}
}
let reminderTimer = 0;
function scheduleReminder() {
  clearTimeout(reminderTimer);
  if (!reminderOn()) return;
  const [h, m] = state.settings.reminderTime.split(':').map(Number);
  const at = new Date(); at.setHours(h, m, 0, 0);
  if (at <= Date.now()) at.setDate(at.getDate() + 1);
  reminderTimer = setTimeout(async () => {
    if (reminderOn()) { await mirrorReminder(); (await swReady)?.active?.postMessage({ type: 'rappel' }); }
    scheduleReminder();
  }, Math.min(at - Date.now() + 1000, 2 ** 31 - 1));
}
async function syncReminder() {
  await mirrorReminder();
  scheduleReminder();
  const reg = await swReady;
  try {
    if (reminderOn()) await reg?.periodicSync?.register('rappel', { minInterval: 60 * 60000 });
    else await reg?.periodicSync?.unregister('rappel');
  } catch {} // refusé tant que l'application n'est pas installée : on réessaie à chaque lancement
}
async function clearReminders() {
  try { (await (await swReady)?.getNotifications({ tag: 'parlons-rappel' }))?.forEach(n => n.close()); } catch {}
}
async function setReminder(on) {
  if (on) {
    let perm = notifOk ? Notification.permission : 'denied';
    if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch { perm = 'denied'; } }
    if (perm !== 'granted') {
      on = false;
      toast('🔕', 'Notifications bloquées', 'Autorisez les notifications de Parlons ! dans les réglages de l\'appareil, puis réessayez.', 6000);
    }
  }
  state.settings.reminder = on;
  if (on) state.hints.notif = 1;
  save();
  await syncReminder();
  if (on) {
    const text = 'Vous serez prévenu vers ' + timeLabel(state.settings.reminderTime) + ', les jours où votre objectif n\'est pas encore atteint.';
    try { await (await swReady).showNotification('🔔 Rappel quotidien activé', { body: text, icon: 'icons/icon-192.png', badge: 'icons/badge-96.png', tag: 'parlons-info', lang: 'fr' }); }
    catch { toast('🔔', 'Rappel quotidien activé', text, 6000); }
  }
  rerender();
}
function reminderNote() {
  if (!notifOk) {
    return isIOS && !isStandalone() ? 'Sur iPhone et iPad, installez d\'abord l\'application sur l\'écran d\'accueil (iOS 16.4 ou plus récent), puis activez le rappel depuis l\'application installée.'
      : 'Ce navigateur ne permet pas les notifications.';
  }
  if (Notification.permission === 'denied') return 'Les notifications sont bloquées. Autorisez-les pour Parlons ! dans les réglages de l\'appareil, puis cochez à nouveau.';
  const base = 'Une notification à l\'heure choisie, les jours où l\'objectif n\'est pas encore atteint. ';
  if (!('PeriodicSyncManager' in window)) return base + 'Sur cet appareil, elle s\'affiche seulement si Parlons ! est resté ouvert en arrière-plan.';
  return base + (isStandalone() ? 'Application fermée, elle peut arriver un peu plus tard.' : 'Installez l\'application pour la recevoir même quand elle est fermée.');
}

TTS.init();
render();
try { if (sessionStorage.getItem('parlons.maj.vue')) { sessionStorage.removeItem('parlons.maj.vue'); toast('✨', 'Application mise à jour', 'Votre progression est intacte.'); } } catch {}
syncReminder();
clearReminders();
setTimeout(checkUpdate, 15000);
setInterval(() => { if (!document.hidden) checkUpdate(); }, 30 * 60000);
// Demande au navigateur de ne pas effacer la progression quand l'appareil manque de place (Firefox poserait la question à l'étudiant).
if (navigator.storage?.persist && !/Firefox/.test(navigator.userAgent)) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
